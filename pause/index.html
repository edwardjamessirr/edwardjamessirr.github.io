<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprout</title>
<meta name="description" content="A pause screen that shows up before distracting apps. Grow a streak, not a scroll.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b2a66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sprout">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b2a66'/%3E%3Cpath d='M32 50V30' stroke='%2386c96f' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M32 34C22 34 16 26 16 18c10 0 16 6 16 16zM32 30c0-10 6-16 16-16 0 8-6 16-16 16z' fill='%2386c96f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --sky1: #1b2a66; --sky2: #2f4596;
    --ground1: #9a7656; --ground2: #7d5e43;
    --ink-sky: #ffffff; --accent: #ffd36b;
    --card: #ffffff; --card-ink: #1d2433; --muted: #5d6676;
    --blue: #3b82f6; --blue-deep: #2563c9; --blue-soft: #eaf2ff;
    --line: #dfe4ec; --danger: #c2410c;
    --radius: 26px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
    background: var(--ground2);
    color: var(--card-ink);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100svh;
  }
  .app { max-width: 480px; margin: 0 auto; min-height: 100svh; display: flex; flex-direction: column; overflow: hidden; }

  /* ---------- sky ---------- */
  .sky {
    background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 100%);
    color: var(--ink-sky);
    padding: calc(18px + env(safe-area-inset-top)) 20px 0;
    text-align: center;
    position: relative;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    font-weight: 800; font-size: 14px; letter-spacing: .02em;
    padding: 7px 14px; border-radius: 999px;
    background: rgba(255,255,255,.16); color: var(--ink-sky);
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  h1 {
    margin: 16px 0 0; font-weight: 900; font-size: clamp(34px, 9.5vw, 44px);
    line-height: 1.05; letter-spacing: -.02em; text-wrap: balance;
  }
  h1 .accent { color: var(--accent); }
  .sub-sky { margin: 10px 0 0; font-weight: 700; font-size: 17px; opacity: .85; }

  .scene-wrap { position: relative; margin: 0 -20px; }
  .scene-wrap svg { display: block; width: 100%; height: auto; }
  .breath-label {
    position: absolute; left: 0; right: 0; top: 4%;
    font-weight: 900; font-size: 20px; letter-spacing: .01em;
    color: var(--ink-sky); transition: opacity .4s;
  }
  .breath-label b { display: block; font-size: 15px; font-weight: 800; opacity: .75; margin-top: 2px; font-variant-numeric: tabular-nums; }

  /* breathing ring + idle bob */
  .ring { transform-box: fill-box; transform-origin: center; transform: scale(.72); opacity: .0; }
  .breathing .ring { animation: breathe 10s ease-in-out forwards; }
  @keyframes breathe {
    0% { transform: scale(.72); opacity: .0; }
    8% { opacity: 1; }
    50% { transform: scale(1.12); opacity: 1; }
    92% { opacity: 1; }
    100% { transform: scale(.72); opacity: 0; }
  }
  .bob { animation: bob 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
  .cheer .bob { animation: hop .6s ease-out 3; }
  @keyframes hop { 0%,100% { transform: translateY(0) scaleY(1) } 30% { transform: translateY(-16px) scaleY(1.04) } 60% { transform: translateY(0) scaleY(.95) } }
  .twinkle { animation: twinkle 2.6s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .35 } 50% { opacity: 1 } }

  /* ---------- ground ---------- */
  .ground {
    flex: 1;
    background: linear-gradient(180deg, var(--ground1) 0%, var(--ground2) 100%);
    padding: 4px 16px calc(28px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 14px;
  }
  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: 0 5px 0 rgba(0,0,0,.14);
    padding: 18px 20px;
  }
  .card h2 { margin: 0 0 4px; font-size: 21px; font-weight: 900; letter-spacing: -.01em; }
  .card p { margin: 0; color: var(--muted); font-weight: 700; font-size: 15.5px; line-height: 1.4; }

  .q-title { color: #fff; font-weight: 900; font-size: 22px; text-align: center; margin: 4px 0 0; text-shadow: 0 2px 0 rgba(0,0,0,.12); text-wrap: balance; }

  .option {
    width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
    font: inherit; color: inherit; cursor: pointer;
    background: var(--card); border: 3px solid transparent; border-radius: var(--radius);
    box-shadow: 0 5px 0 rgba(0,0,0,.14);
    padding: 14px 18px;
    transition: transform .12s, border-color .15s, background .15s;
  }
  .option:active { transform: translateY(2px); }
  .option[aria-checked="true"] { border-color: var(--blue); background: var(--blue-soft); box-shadow: 0 5px 0 var(--blue-deep); }
  .radio { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 3px solid #cfd5df; display: grid; place-items: center; background: #fff; }
  .option[aria-checked="true"] .radio { border-color: var(--blue); }
  .option[aria-checked="true"] .radio::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--blue); }
  .option b { display: block; font-size: 18px; font-weight: 900; }
  .option span.s { display: block; font-size: 14.5px; font-weight: 700; color: var(--muted); margin-top: 1px; }
  .options { display: flex; flex-direction: column; gap: 10px; }

  .btn {
    display: block; width: 100%; border: 0; cursor: pointer; text-decoration: none; text-align: center;
    font: inherit; font-weight: 900; font-size: 21px;
    padding: 17px 20px; border-radius: 999px;
    background: var(--blue); color: #fff;
    box-shadow: 0 6px 0 var(--blue-deep);
    transition: transform .1s, box-shadow .1s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--blue-deep); }
  .btn.ghost { background: rgba(255,255,255,.2); color: #fff; box-shadow: none; font-size: 16px; padding: 13px 18px; }
  .btn.ghost:disabled { opacity: .45; cursor: default; }
  .btn.ghost.warn { background: rgba(0,0,0,.2); }
  .fine { color: rgba(255,255,255,.92); text-align: center; font-weight: 700; font-size: 14.5px; margin: 0; line-height: 1.45; text-shadow: 0 1px 0 rgba(0,0,0,.1); }
  .fine a { color: #fff; }

  .hidden { display: none !important; }
  .fade-in { animation: fadeUp .45s ease-out both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }

  /* ---------- dashboard ---------- */
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .stat { background: var(--card); border-radius: 20px; box-shadow: 0 5px 0 rgba(0,0,0,.14); padding: 12px 8px; text-align: center; }
  .stat b { display: block; font-size: 28px; font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; font-weight: 800; color: var(--muted); }
  .streak-card { display: flex; align-items: center; gap: 16px; }
  .streak-num { flex: none; font-size: 48px; font-weight: 900; line-height: 1; color: var(--blue); font-variant-numeric: tabular-nums; min-width: 64px; text-align: center; }

  .themes { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 10px; margin-top: 14px; }
  .theme { text-align: center; width: calc((100% - 20px) / 3); }
  .theme .thumb { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 1; border: 3px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  .theme .thumb svg { width: 100%; height: 100%; display: block; }
  .theme.locked .thumb::after { content: ""; position: absolute; inset: 0; background: rgba(30,36,50,.55); }
  .theme .lock { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; }
  .theme .thumb .lock svg { width: 26px; height: 26px; }
  .theme.current .thumb { border-color: var(--blue); }
  .theme small { display: block; margin-top: 5px; font-weight: 900; font-size: 14px; }
  .theme small i { font-style: normal; display: block; font-weight: 700; font-size: 12.5px; color: var(--muted); }

  details.step { border-top: 2px solid var(--line); }
  details.step:first-of-type { border-top: 0; }
  details.step summary {
    list-style: none; cursor: pointer; padding: 14px 0; display: flex; align-items: center; gap: 12px;
    font-weight: 900; font-size: 17px;
  }
  details.step summary::-webkit-details-marker { display: none; }
  .num { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--blue-soft); color: var(--blue-deep); display: grid; place-items: center; font-weight: 900; font-size: 15px; }
  .chev { margin-left: auto; transition: transform .2s; color: var(--muted); }
  details[open] .chev { transform: rotate(90deg); }
  .step-body { padding: 0 0 16px 42px; font-weight: 700; font-size: 15px; color: #3b4352; line-height: 1.5; }
  .step-body ol { margin: 6px 0 0; padding-left: 18px; }
  .step-body li { margin: 4px 0; }
  .step-body em { font-style: normal; background: #f1f3f7; border-radius: 6px; padding: 1px 6px; color: var(--card-ink); font-weight: 800; }
  .step-body .tag { display: inline-block; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; color: var(--blue-deep); margin-bottom: 4px; }
  .note { margin-top: 10px; background: #fff7e6; border-radius: 12px; padding: 10px 12px; color: #6b4a12; font-size: 14px; }

  .links { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .link-row { display: flex; align-items: center; gap: 8px; background: #f4f6fa; border-radius: 14px; padding: 8px 8px 8px 12px; }
  .link-row strong { font-size: 15px; font-weight: 900; min-width: 78px; }
  .link-row code { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Menlo, monospace; }
  .copy { flex: none; border: 0; border-radius: 999px; background: var(--blue); color: #fff; font: inherit; font-weight: 900; font-size: 13px; padding: 7px 12px; cursor: pointer; }
  .copy.done { background: #16a34a; }
  .textlink { background: none; border: 0; padding: 0; font: inherit; font-weight: 800; color: rgba(255,255,255,.85); text-decoration: underline; cursor: pointer; font-size: 14px; }
  .footer-links { display: flex; justify-content: center; gap: 22px; margin-top: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .bob, .twinkle, .cheer .bob { animation: none; }
    .breathing .ring { animation-duration: .01s; }
    .fade-in { animation: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <section class="sky">
    <span class="pill" id="pill"><span class="dot"></span><span id="pill-text">Sprout</span></span>
    <h1 id="title"></h1>
    <p class="sub-sky hidden" id="sub-sky"></p>
    <div class="scene-wrap" id="scene-wrap">
      <div class="breath-label hidden" id="breath-label" aria-live="polite"></div>
      <div id="scene"></div>
    </div>
  </section>
  <section class="ground" id="ground"></section>
</div>

<script>
(function () {
  "use strict";

  /* ---------- config ---------- */
  var THEMES = [
    { key: "dusk",   name: "Dusk",   day: 0,   sky: ["#1b2a66", "#2f4596"], ground: ["#9a7656", "#7d5e43"], ink: "#ffffff", accent: "#ffd36b" },
    { key: "meadow", name: "Meadow", day: 3,   sky: ["#2f7fcf", "#8fcaf0"], ground: ["#7fc266", "#5ea24f"], ink: "#ffffff", accent: "#ffe27a" },
    { key: "ocean",  name: "Ocean",  day: 7,   sky: ["#2b8fd0", "#a9dcf3"], ground: ["#efcf93", "#d9b06e"], ink: "#ffffff", accent: "#fff09a" },
    { key: "autumn", name: "Autumn", day: 14,  sky: ["#d9714a", "#f6c58e"], ground: ["#c7773f", "#a45b2a"], ink: "#ffffff", accent: "#fff1b8" },
    { key: "aurora", name: "Aurora", day: 30,  sky: ["#0c1430", "#1c2c5c"], ground: ["#e3eaf6", "#bcc8df"], ink: "#ffffff", accent: "#7ef0b5" },
    { key: "golden", name: "Golden", day: 100, sky: ["#e9951f", "#fcdf8e"], ground: ["#dc9a3b", "#bf7d24"], ink: "#3a240c", accent: "#a8410c" },
    { key: "cosmos", name: "Cosmos", day: 365, sky: ["#160c38", "#3a1f6c"], ground: ["#b7a7d8", "#8c7cb6"], ink: "#ffffff", accent: "#ffb3e6" }
  ];
  var APPS = {
    tiktok:    { name: "TikTok",    url: "tiktok://" },
    instagram: { name: "Instagram", url: "instagram://" },
    youtube:   { name: "YouTube",   url: "youtube://" },
    x:         { name: "X",         url: "twitter://" },
    snapchat:  { name: "Snapchat",  url: "snapchat://" },
    reddit:    { name: "Reddit",    url: "reddit://" },
    facebook:  { name: "Facebook",  url: "fb://" }
  };
  var REASONS = [
    { key: "bored", label: "I'm bored",          sub: "Scrolling won't fix it.",                       breaks: true },
    { key: "habit", label: "Just habit",         sub: "My thumb went there on its own.",              breaks: true },
    { key: "need",  label: "I need it for something", sub: "A message, work, a search. Streak stays safe.", breaks: false },
    { key: "want",  label: "I really want to watch something", sub: "Fair. It costs your streak.",   breaks: true }
  ];
  var BREATH_SECONDS = 10;
  var LET_ME_IN = "Let Me In";
  var STORE_KEY = "sprout.v1";

  /* ---------- storage ---------- */
  function today(d) {
    d = d || new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function daysBetween(a, b) {
    var x = a.split("-").map(Number), y = b.split("-").map(Number);
    return Math.round((Date.UTC(y[0], y[1] - 1, y[2]) - Date.UTC(x[0], x[1] - 1, x[2])) / 864e5);
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (s && s.log && s.startedAt) return s;
    } catch (e) {}
    return { startedAt: today(), lastSlip: null, best: 0, log: {} };
  }
  function save() {
    try {
      var keys = Object.keys(state.log).sort();
      while (keys.length > 90) delete state.log[keys.shift()];
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    } catch (e) {}
  }
  function streak() { return Math.max(0, daysBetween(state.lastSlip || state.startedAt, today())); }
  function dayLog() {
    var k = today();
    if (!state.log[k]) state.log[k] = { attempts: 0, pass: 0, slip: 0, needed: 0, apps: {} };
    return state.log[k];
  }
  function themeIndex(days) { var i = 0; THEMES.forEach(function (t, k) { if (days >= t.day) i = k; }); return i; }

  var state = load();
  state.best = Math.max(state.best || 0, streak());
  save();

  /* ---------- drawing ---------- */
  var OUT = "#2b1a12";
  function leaf(x, y, dir, s) {
    return '<path d="M' + x + ' ' + y +
      ' Q' + (x + dir * s * 0.45) + ' ' + (y - s * 0.95) + ' ' + (x + dir * s) + ' ' + (y - s * 0.62) +
      ' Q' + (x + dir * s * 0.62) + ' ' + (y - s * 0.02) + ' ' + x + ' ' + y + 'Z" fill="#6cc160" stroke="' + OUT + '" stroke-width="3.5" stroke-linejoin="round"/>' +
      '<path d="M' + (x + dir * 4) + ' ' + (y - 4) + ' Q' + (x + dir * s * 0.5) + ' ' + (y - s * 0.45) + ' ' + (x + dir * s * 0.82) + ' ' + (y - s * 0.6) + '" fill="none" stroke="#4e9e48" stroke-width="2.5" stroke-linecap="round"/>';
  }
  function stem(top) {
    return '<path d="M200 176 Q195 ' + ((176 + top) / 2) + ' 200 ' + top + '" fill="none" stroke="' + OUT + '" stroke-width="10" stroke-linecap="round"/>' +
           '<path d="M200 176 Q195 ' + ((176 + top) / 2) + ' 200 ' + top + '" fill="none" stroke="#5aae4f" stroke-width="5" stroke-linecap="round"/>';
  }
  function flower(cx, cy, r, color) {
    var p = "";
    for (var i = 0; i < 6; i++) {
      var a = i * Math.PI / 3;
      p += '<circle cx="' + (cx + Math.cos(a) * r * 1.15).toFixed(1) + '" cy="' + (cy + Math.sin(a) * r * 1.15).toFixed(1) + '" r="' + r + '" fill="' + color + '" stroke="' + OUT + '" stroke-width="3.5"/>';
    }
    return p + '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r * 0.85) + '" fill="#ffd54a" stroke="' + OUT + '" stroke-width="3.5"/>';
  }
  function sparkle(x, y, s) {
    return '<path class="twinkle" d="M' + x + ' ' + (y - s) + ' Q' + x + ' ' + y + ' ' + (x + s) + ' ' + y + ' Q' + x + ' ' + y + ' ' + x + ' ' + (y + s) + ' Q' + x + ' ' + y + ' ' + (x - s) + ' ' + y + ' Q' + x + ' ' + y + ' ' + x + ' ' + (y - s) + 'Z" fill="#fff6c2"/>';
  }
  function plant(stage) {
    switch (stage) {
      case 0:
        return '<ellipse cx="200" cy="166" rx="9" ry="11" fill="#b9814f" stroke="' + OUT + '" stroke-width="3.5"/>' +
               '<path d="M200 156 q2 -8 8 -10" fill="none" stroke="#5aae4f" stroke-width="4" stroke-linecap="round"/>';
      case 1:
        return stem(138) + leaf(200, 142, -1, 30) + leaf(200, 146, 1, 30);
      case 2:
        return stem(108) + leaf(200, 150, -1, 34) + leaf(200, 152, 1, 34) + leaf(200, 116, -1, 30) + leaf(200, 120, 1, 30);
      case 3:
        return stem(96) + leaf(200, 152, -1, 36) + leaf(200, 154, 1, 36) + leaf(200, 122, -1, 32) + leaf(200, 126, 1, 32) +
               '<path d="M200 70 C214 78 214 98 200 102 C186 98 186 78 200 70Z" fill="#f48fb1" stroke="' + OUT + '" stroke-width="3.5" stroke-linejoin="round"/>' +
               '<path d="M188 96 Q200 108 212 96 Q206 104 200 104 Q194 104 188 96Z" fill="#6cc160" stroke="' + OUT + '" stroke-width="3" stroke-linejoin="round"/>';
      case 4:
        return stem(96) + leaf(200, 152, -1, 36) + leaf(200, 154, 1, 36) + leaf(200, 122, -1, 32) + leaf(200, 126, 1, 32) + flower(200, 84, 12, "#f48fb1");
      default:
        return '<path d="M200 140 Q226 126 236 104" fill="none" stroke="' + OUT + '" stroke-width="9" stroke-linecap="round"/>' +
               '<path d="M200 140 Q226 126 236 104" fill="none" stroke="#5aae4f" stroke-width="4.5" stroke-linecap="round"/>' +
               stem(92) + leaf(200, 154, -1, 38) + leaf(200, 156, 1, 30) + leaf(200, 124, -1, 34) +
               flower(236, 100, 8, "#ffffff") + flower(200, 80, 13, "#f48fb1") +
               sparkle(150, 70, 9) + sparkle(258, 64, 7) + sparkle(266, 140, 6) + sparkle(138, 128, 6);
    }
  }
  function face(mood) {
    var eyes, mouth, extra = "";
    if (mood === "calm") {
      eyes = '<path d="M180 212 q7 7 14 0 M206 212 q7 7 14 0" fill="none" stroke="' + OUT + '" stroke-width="3.5" stroke-linecap="round"/>';
      mouth = '<path d="M192 225 q8 7 16 0" fill="none" stroke="' + OUT + '" stroke-width="3.5" stroke-linecap="round"/>';
    } else if (mood === "happy") {
      eyes = '<path d="M180 216 q7 -9 14 0 M206 216 q7 -9 14 0" fill="none" stroke="' + OUT + '" stroke-width="3.5" stroke-linecap="round"/>';
      mouth = '<path d="M189 223 q11 15 22 0 z" fill="#8a2f22" stroke="' + OUT + '" stroke-width="3" stroke-linejoin="round"/>';
    } else if (mood === "sad") {
      eyes = '<circle cx="187" cy="214" r="4.5" fill="' + OUT + '"/><circle cx="213" cy="214" r="4.5" fill="' + OUT + '"/>' +
             '<path d="M180 205 l10 -3 M220 205 l-10 -3" stroke="' + OUT + '" stroke-width="3" stroke-linecap="round"/>';
      mouth = '<path d="M193 230 q7 -6 14 0" fill="none" stroke="' + OUT + '" stroke-width="3.5" stroke-linecap="round"/>';
      extra = '<path d="M221 219 q3 6 0 8 q-3 -2 0 -8z" fill="#7cc4f2"/>';
    } else {
      eyes = '<circle cx="187" cy="214" r="4.8" fill="' + OUT + '"/><circle cx="213" cy="214" r="4.8" fill="' + OUT + '"/>' +
             '<circle cx="188.6" cy="212.4" r="1.6" fill="#fff"/><circle cx="214.6" cy="212.4" r="1.6" fill="#fff"/>';
      mouth = '<path d="M193 225 q7 6 14 0" fill="none" stroke="' + OUT + '" stroke-width="3.5" stroke-linecap="round"/>';
    }
    return '<ellipse cx="177" cy="224" rx="6.5" ry="3.8" fill="#f4a3a0" opacity=".9"/><ellipse cx="223" cy="224" rx="6.5" ry="3.8" fill="#f4a3a0" opacity=".9"/>' + eyes + mouth + extra;
  }
  function mascot(stage, mood) {
    return '<ellipse cx="200" cy="264" rx="54" ry="8" fill="#000" opacity=".14"/>' +
      '<g class="bob">' +
        plant(stage) +
        (stage >= 6 ? '<ellipse cx="200" cy="120" rx="74" ry="66" fill="#bfe6ff" fill-opacity=".22" stroke="#e8f6ff" stroke-width="4"/>' +

  function pauseScreen() {

  function askWhy(app, count) {

        '<div class="note">Now “Open anyway” gives you 10 minutes in that app before the pause screen comes back.</div>' +
      "</div></details>" +

      '<details class="step"><summary><span class="num">4</span>Try it<span class="chev">›</span></summary><div class="step-body">' +
        "Do a practice run. Nothing gets counted.<div style=\"margin-top:10px\"><a class=\"btn\" style=\"font-size:17px;padding:13px\" href=\"?app=tiktok&amp;demo\">Practice pause screen</a></div>" +
      "</div></details>" +
      "</div>" +

      '<div class="footer-links"><button class="textlink" id="reset">Reset all data</button></div>';

    Array.prototype.forEach.call(document.querySelectorAll(".copy"), function (b) {
      b.addEventListener("click", function () {
        var text = b.dataset.copy;
        var ok = function () { b.textContent = "Copied"; b.classList.add("done"); setTimeout(function () { b.textContent = "Copy"; b.classList.remove("done"); }, 1600); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, function () { fallbackCopy(text); ok(); });
        else { fallbackCopy(text); ok(); }
      });
    });
    $("reset").addEventListener("click", function () {
      if (!confirm("Reset your streak and all stats?")) return;
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      location.reload();
    });
    if (location.hash === "#setup") {
      var st = document.querySelectorAll("details.step");
      if (st[2]) st[2].open = true;
      $("setup").scrollIntoView();
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    ta.remove();
  }
})();
</script>
</body>
</html>
