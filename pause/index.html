<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elderwood</title>
<meta name="description" content="A pause before distracting apps. Every day you hold out, the realm around the old tree heals.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#140909">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Elderwood">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141a2e'/%3E%3Cpath d='M22 56c6-2 8-8 8-16 0-6-4-9-10-11 6 0 9 2 11 5 0-8-2-13-6-17 6 3 8 9 8 15 1-6 4-11 9-14-3 5-5 10-5 16 3-3 7-4 11-4-5 2-8 6-8 12 0 7 2 12 8 14z' fill='%23e8c372'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=EB+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky1: #140909; --sky2: #4a1d16;
    --ground1: #3a302c; --ground2: #1e1917;
    --ink-sky: #f3e3c3; --accent: #ff9b5e;
    --parch: #f1e4c6; --parch-2: #e6d3aa; --parch-ink: #2a1c0e; --parch-muted: #6a5536;
    --gold: #e8c372; --gold-2: #b8862f; --gold-deep: #6e4d17; --gold-line: #9c7637;
    --radius: 14px;
    --title: "Cinzel", "Trajan Pro", Georgia, serif;
    --body: "EB Garamond", Garamond, Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--body);
    background: var(--ground2);
    color: var(--parch-ink);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100svh;
  }
  .app { max-width: 480px; margin: 0 auto; min-height: 100svh; display: flex; flex-direction: column; overflow: hidden; }

  /* ---------- sky ---------- */
  .sky {
    background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 100%);
    color: var(--ink-sky);
    padding: calc(18px + env(safe-area-inset-top)) 20px 0;
    text-align: center;
    position: relative;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 9px;
    font-family: var(--title); font-weight: 700; font-size: 12.5px; letter-spacing: .28em; text-transform: uppercase;
    padding: 7px 14px 7px 16px; border-radius: 999px;
    background: rgba(0,0,0,.28); color: var(--ink-sky);
    border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
  }
  .pill .gem { width: 7px; height: 7px; background: var(--accent); transform: rotate(45deg); box-shadow: 0 0 8px var(--accent); }
  h1 {
    margin: 16px 0 0; font-family: var(--title); font-weight: 900;
    font-size: clamp(27px, 7.6vw, 35px); line-height: 1.12; letter-spacing: .01em; text-wrap: balance;
    text-shadow: 0 2px 12px rgba(0,0,0,.45);
  }
  h1 .accent { color: var(--accent); }
  .orn { display: block; margin: 10px auto 0; width: 150px; height: 12px; color: var(--accent); opacity: .85; }

  .scene-wrap { position: relative; margin: 0 -20px; }
  .scene-wrap svg { display: block; width: 100%; height: auto; }
  .breath-label {
    position: absolute; left: 0; right: 0; top: 2%;
    font-family: var(--title); font-weight: 700; font-size: 18px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-sky); text-shadow: 0 2px 10px rgba(0,0,0,.6);
  }
  .breath-label b { display: block; font-size: 15px; font-weight: 600; letter-spacing: .1em; opacity: .8; margin-top: 2px; font-variant-numeric: tabular-nums; }

  .ring { transform-box: fill-box; transform-origin: center; transform: scale(.7); opacity: 0; }
  .breathing .ring { animation: breathe 10s ease-in-out forwards; }
  @keyframes breathe {
    0% { transform: scale(.7); opacity: 0; } 8% { opacity: 1; }
    50% { transform: scale(1.1); opacity: 1; } 92% { opacity: 1; }
    100% { transform: scale(.7); opacity: 0; }
  }
  .sway { animation: sway 7s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes sway { 0%,100% { transform: rotate(-.8deg) } 50% { transform: rotate(.8deg) } }
  .cheer .glow-eye { animation: flare 1.4s ease-out 2; }
  @keyframes flare { 0%,100% { opacity: 1 } 40% { opacity: .3 } }
  .twinkle { animation: twinkle 2.8s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
  .rise { animation: rise 5s linear infinite; transform-box: fill-box; }
  @keyframes rise { 0% { transform: translateY(0); opacity: 0 } 15% { opacity: 1 } 100% { transform: translateY(-70px); opacity: 0 } }
  .drift { animation: drift 6s ease-in-out infinite; transform-box: fill-box; }
  @keyframes drift { 0%,100% { transform: translate(0,0) } 50% { transform: translate(8px,-10px) } }
  .fall { animation: fall 7s linear infinite; transform-box: fill-box; }
  @keyframes fall { 0% { transform: translate(0,-10px) rotate(0); opacity: 0 } 10% { opacity: 1 } 100% { transform: translate(-30px,90px) rotate(200deg); opacity: 0 } }

  /* ---------- ground ---------- */
  .ground {
    flex: 1;
    background: linear-gradient(180deg, var(--ground1) 0%, var(--ground2) 70%);
    padding: 6px 16px calc(28px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 14px;
  }
  .card {
    background: linear-gradient(180deg, var(--parch) 0%, var(--parch-2) 100%);
    border: 2px solid var(--gold-line); border-radius: var(--radius);
    box-shadow: inset 0 0 0 3px var(--parch), inset 0 0 0 4px rgba(156,118,55,.45), 0 8px 22px rgba(0,0,0,.4);
    padding: 18px 20px;
  }
  .card h2 { margin: 0 0 4px; font-family: var(--title); font-size: 19px; font-weight: 700; letter-spacing: .02em; }
  .card p { margin: 0; color: var(--parch-muted); font-weight: 600; font-size: 17px; line-height: 1.38; }

  .option {
    width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
    font: inherit; color: inherit; cursor: pointer;
    background: linear-gradient(180deg, var(--parch) 0%, var(--parch-2) 100%);
    border: 2px solid var(--gold-line); border-radius: var(--radius);
    box-shadow: inset 0 0 0 3px var(--parch), inset 0 0 0 4px rgba(156,118,55,.35), 0 6px 16px rgba(0,0,0,.35);
    padding: 13px 18px;
    transition: transform .12s, box-shadow .15s, border-color .15s;
  }
  .option:active { transform: translateY(2px); }
  .option[aria-checked="true"] {
    border-color: var(--gold);
    box-shadow: inset 0 0 0 3px var(--parch), inset 0 0 0 4px var(--gold-2), 0 0 0 3px rgba(232,195,114,.5), 0 6px 22px rgba(232,195,114,.35);
  }
  .gemradio { flex: none; width: 20px; height: 20px; margin: 0 4px; transform: rotate(45deg); border: 2px solid var(--gold-line); background: rgba(255,255,255,.4); display: grid; place-items: center; }
  .option[aria-checked="true"] .gemradio { border-color: var(--gold-deep); }
  .option[aria-checked="true"] .gemradio::after { content: ""; width: 10px; height: 10px; background: linear-gradient(135deg, #f7dc93, var(--gold-2)); box-shadow: 0 0 6px var(--gold); }
  .option b { display: block; font-family: var(--title); font-size: 16.5px; font-weight: 700; letter-spacing: .02em; }
  .option span.s { display: block; font-size: 16px; font-weight: 600; color: var(--parch-muted); margin-top: 1px; line-height: 1.3; }
  .options { display: flex; flex-direction: column; gap: 10px; }

  .btn {
    display: block; width: 100%; cursor: pointer; text-decoration: none; text-align: center;
    font-family: var(--title); font-weight: 900; font-size: 19px; letter-spacing: .08em; text-transform: uppercase;
    padding: 16px 20px; border-radius: 12px;
    background: linear-gradient(180deg, #f2d78e 0%, var(--gold) 35%, var(--gold-2) 100%);
    color: #2a1806; border: 1px solid var(--gold-deep);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 5px 0 var(--gold-deep), 0 10px 24px rgba(0,0,0,.35);
    transition: transform .1s, box-shadow .1s;
  }
  .btn:active { transform: translateY(4px); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 1px 0 var(--gold-deep); }
  .btn.ghost {
    background: rgba(0,0,0,.25); color: #f3e3b8; border: 1px solid rgba(232,195,114,.55);
    box-shadow: none; font-size: 13.5px; letter-spacing: .06em; padding: 13px 16px;
  }
  .btn.ghost:disabled { opacity: .45; cursor: default; }
  .btn.ghost.warn { color: #ffb48a; border-color: rgba(255,140,90,.55); }
  .fine { color: rgba(243,227,195,.9); text-align: center; font-weight: 600; font-size: 16.5px; margin: 0; line-height: 1.4; }
  .fine a { color: var(--gold); }
  .fine.smallcaps { font-family: var(--title); font-size: 12.5px; letter-spacing: .16em; text-transform: uppercase; }

  .hidden { display: none !important; }
  .fade-in { animation: fadeUp .5s ease-out both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }

  /* ---------- dashboard ---------- */
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .stat {
    background: rgba(0,0,0,.28); border: 1px solid rgba(232,195,114,.4); border-radius: 12px;
    padding: 12px 6px 10px; text-align: center; color: #f3e3c3;
  }
  .stat b { display: block; font-family: var(--title); font-size: 26px; font-weight: 900; line-height: 1.1; color: var(--gold); font-variant-numeric: tabular-nums; }
  .stat span { font-family: var(--title); font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
  .streak-card { display: flex; align-items: center; gap: 16px; }
  .streak-num { flex: none; font-family: var(--title); font-size: 46px; font-weight: 900; line-height: 1; color: var(--gold-deep); font-variant-numeric: tabular-nums; min-width: 60px; text-align: center; }

  .themes { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 10px; margin-top: 16px; }
  .theme { text-align: center; width: calc((100% - 20px) / 3); }
  .theme .thumb { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 1; border: 2px solid var(--gold-line); box-shadow: 0 3px 8px rgba(0,0,0,.25); }
  .theme .thumb > svg { width: 100%; height: 100%; display: block; }
  .theme.locked .thumb::after { content: ""; position: absolute; inset: 0; background: rgba(20,14,8,.62); }
  .theme .lock { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; }
  .theme .thumb .lock svg { width: 24px; height: 24px; }
  .theme.current .thumb { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold), 0 0 14px rgba(232,195,114,.6); }
  .theme small { display: block; margin-top: 6px; font-family: var(--title); font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  .theme small i { font-family: var(--body); text-transform: none; letter-spacing: 0; font-style: italic; display: block; font-weight: 600; font-size: 14.5px; color: var(--parch-muted); }

  details.step { border-top: 1px solid rgba(156,118,55,.4); }
  details.step:first-of-type { border-top: 0; }
  details.step summary {
    list-style: none; cursor: pointer; padding: 14px 0; display: flex; align-items: center; gap: 12px;
    font-family: var(--title); font-weight: 700; font-size: 15.5px; letter-spacing: .02em;
  }
  details.step summary::-webkit-details-marker { display: none; }
  .num { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--gold-line); color: var(--gold-deep); display: grid; place-items: center; font-family: var(--title); font-weight: 900; font-size: 14px; }
  .chev { margin-left: auto; transition: transform .2s; color: var(--parch-muted); }
  details[open] .chev { transform: rotate(90deg); }
  .step-body { padding: 0 0 16px 40px; font-weight: 600; font-size: 17px; color: #3d2c18; line-height: 1.45; }
  .step-body ol { margin: 6px 0 0; padding-left: 18px; }
  .step-body li { margin: 5px 0; }
  .step-body em { font-style: normal; background: rgba(156,118,55,.16); border-radius: 5px; padding: 0 5px; color: var(--parch-ink); font-weight: 700; }
  .step-body .tag { display: inline-block; font-family: var(--title); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .14em; color: var(--gold-deep); margin-bottom: 4px; }
  .note { margin-top: 10px; background: rgba(156,118,55,.14); border-left: 3px solid var(--gold-line); border-radius: 6px; padding: 8px 12px; color: #4e3a1e; font-size: 16px; }

  .links { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .link-row { display: flex; align-items: center; gap: 8px; background: rgba(156,118,55,.12); border-radius: 10px; padding: 7px 7px 7px 12px; }
  .link-row strong { font-family: var(--title); font-size: 13px; font-weight: 700; min-width: 82px; }
  .link-row code { flex: 1; min-width: 0; font-size: 12px; color: var(--parch-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Menlo, monospace; }
  .copy { flex: none; border: 1px solid var(--gold-deep); border-radius: 8px; background: linear-gradient(180deg, var(--gold), var(--gold-2)); color: #2a1806; font-family: var(--title); font-weight: 700; font-size: 11.5px; letter-spacing: .08em; padding: 7px 11px; cursor: pointer; }
  .copy.done { background: #3f7a3a; color: #fff; border-color: #24481f; }
  .textlink { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: rgba(243,227,195,.75); text-decoration: underline; cursor: pointer; font-size: 15px; }
  .footer-links { display: flex; justify-content: center; gap: 22px; margin-top: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .sway, .twinkle, .rise, .drift, .fall, .cheer .glow-eye { animation: none; }
    .rise, .fall { opacity: 0; }
    .breathing .ring { animation-duration: .01s; }
    .fade-in { animation: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <section class="sky">
    <span class="pill"><span class="gem"></span><span id="pill-text">Elderwood</span></span>
    <h1 id="title"></h1>
    <svg class="orn" viewBox="0 0 150 12" aria-hidden="true"><path d="M0 6 H62 M88 6 H150" stroke="currentColor" stroke-width="1"/><path d="M75 0 L81 6 L75 12 L69 6Z" fill="currentColor"/><circle cx="64" cy="6" r="1.6" fill="currentColor"/><circle cx="86" cy="6" r="1.6" fill="currentColor"/></svg>
    <div class="scene-wrap" id="scene-wrap">
      <div class="breath-label hidden" id="breath-label" aria-live="polite"></div>
      <div id="scene"></div>
    </div>
  </section>
  <section class="ground" id="ground"></section>
</div>

<script>
(function () {
  "use strict";

  /* ---------- config ---------- */
  var THEMES = [
    { key: "blight",  name: "The Blight",    day: 0,   sky: ["#140909", "#4a1d16"], ground: ["#3a302c", "#1e1917"], ink: "#f3e3c3", accent: "#ff9b5e", bark: ["#4c4541", "#2c2725"], leaf: null },
    { key: "dawn",    name: "First Light",   day: 3,   sky: ["#1f2a48", "#c98c6c"], ground: ["#4a5f36", "#26331c"], ink: "#f6ead0", accent: "#ffd08a", bark: ["#5e4432", "#3a281b"], leaf: ["#3f6a30", "#5f9045", "#9cc871"] },
    { key: "vale",    name: "Green Vale",    day: 7,   sky: ["#2f6696", "#a9cbd9"], ground: ["#527b35", "#2a4419"], ink: "#ffffff", accent: "#fff0b0", bark: ["#5e4432", "#3a281b"], leaf: ["#2a5626", "#478536", "#80b957"] },
    { key: "peaks",   name: "High Peaks",    day: 14,  sky: ["#18233e", "#7489b0"], ground: ["#3d5340", "#1d2b22"], ink: "#ffffff", accent: "#e8c372", bark: ["#584033", "#35261c"], leaf: ["#1d3f2d", "#2d5f42", "#538c66"] },
    { key: "silver",  name: "Silver Wood",   day: 30,  sky: ["#060d1c", "#1a2d4b"], ground: ["#213834", "#0d1b18"], ink: "#ffffff", accent: "#dfe9f4", bark: ["#5a5650", "#33302c"], leaf: ["#71839a", "#a9b9cb", "#eaf1f8"] },
    { key: "golden",  name: "Golden Age",    day: 100, sky: ["#2a1a43", "#e38e4c"], ground: ["#6a5022", "#33270e"], ink: "#ffffff", accent: "#ffd36b", bark: ["#5e4432", "#3a281b"], leaf: ["#a8681a", "#df9c34", "#ffd679"] },
    { key: "starlit", name: "Starlit Crown", day: 365, sky: ["#04061a", "#181244"], ground: ["#1a1f3e", "#090c20"], ink: "#ffffff", accent: "#c9b8ff", bark: ["#3f3a52", "#221f33"], leaf: ["#25296e", "#3a42a0", "#7a84e2"] }
  ];
  var APPS = {
    tiktok:    { name: "TikTok",    url: "tiktok://" },
    instagram: { name: "Instagram", url: "instagram://" },
    youtube:   { name: "YouTube",   url: "youtube://" },
    x:         { name: "X",         url: "twitter://" },
    snapchat:  { name: "Snapchat",  url: "snapchat://" },
    reddit:    { name: "Reddit",    url: "reddit://" },
    facebook:  { name: "Facebook",  url: "fb://" }
  };
  var REASONS = [
    { key: "bored", label: "Idle boredom",         sub: "The scroll won't cure it.",                        breaks: true },
    { key: "habit", label: "Old habit",            sub: "Your hand moved before your mind did.",            breaks: true },
    { key: "need",  label: "A true errand",        sub: "A message, work, a search. Your streak is safe.",  breaks: false },
    { key: "want",  label: "The craving to watch", sub: "So be it, but the blight returns.",                breaks: true }
  ];
  var BREATH_SECONDS = 10;
  var LET_ME_IN = "Let Me In";
  var STORE_KEY = "elderwood.v1";

  /* ---------- storage ---------- */
  function today(d) {
    d = d || new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function daysBetween(a, b) {
    var x = a.split("-").map(Number), y = b.split("-").map(Number);
    return Math.round((Date.UTC(y[0], y[1] - 1, y[2]) - Date.UTC(x[0], x[1] - 1, x[2])) / 864e5);
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(STORE_KEY));
      if (s && s.log && s.startedAt) return s;
    } catch (e) {}
    return { startedAt: today(), lastSlip: null, best: 0, log: {} };
  }
  function save() {
    try {
      var keys = Object.keys(state.log).sort();
      while (keys.length > 90) delete state.log[keys.shift()];
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    } catch (e) {}
  }
  function streak() { return Math.max(0, daysBetween(state.lastSlip || state.startedAt, today())); }
  function dayLog() {
    var k = today();
    if (!state.log[k]) state.log[k] = { attempts: 0, pass: 0, slip: 0, needed: 0, apps: {} };
    return state.log[k];
  }
  function themeIndex(days) { var i = 0; THEMES.forEach(function (t, k) { if (days >= t.day) i = k; }); return i; }

  var state = load();
  state.best = Math.max(state.best || 0, streak());
  save();

  /* ---------- drawing ---------- */
  var uid = 0;
  var DARK = "#170e07";

  function stars(list, color) {
    return list.map(function (s, i) {
      return '<circle class="twinkle" style="animation-delay:' + (i * .27).toFixed(2) + 's" cx="' + s[0] + '" cy="' + s[1] + '" r="' + (s[2] || 1.4) + '" fill="' + (color || "#fff") + '"/>';
    }).join("");
  }
  function sparkle(x, y, s, c) {
    return '<path class="twinkle" d="M' + x + ' ' + (y - s) + ' Q' + x + ' ' + y + ' ' + (x + s) + ' ' + y + ' Q' + x + ' ' + y + ' ' + x + ' ' + (y + s) + ' Q' + x + ' ' + y + ' ' + (x - s) + ' ' + y + ' Q' + x + ' ' + y + ' ' + x + ' ' + (y - s) + 'Z" fill="' + (c || "#fff") + '"/>';
  }
  function mist(y, o) {
    return '<ellipse cx="90" cy="' + y + '" rx="150" ry="9" fill="#fff" opacity="' + o + '"/><ellipse cx="320" cy="' + (y + 6) + '" rx="140" ry="8" fill="#fff" opacity="' + (o * .8) + '"/>';
  }
  function pine(x, y, s, c) {
    return '<path transform="translate(' + x + ' ' + y + ') scale(' + s + ')" d="M0 -70 L10 -50 L6 -50 L18 -28 L12 -28 L26 -4 L-26 -4 L-12 -28 L-18 -28 L-6 -50 L-10 -50Z M-3 -4 h6 v8 h-6z" fill="' + c + '"/>';
  }

  /* The old tree: a gnarled trunk with a face in its bark. */
  var TRUNK = "M116 266 C140 262 158 252 166 238 C171 222 171 204 168 188 C164 172 150 160 132 152 C120 147 108 146 98 142 " +
    "C104 136 116 136 128 138 C146 141 160 148 172 156 C174 140 172 122 164 104 C160 96 156 90 152 82 C160 84 168 90 174 98 " +
    "C182 110 186 126 188 140 C192 124 194 104 196 84 C197 76 199 70 200 64 C202 72 204 80 206 88 C208 104 208 124 210 140 " +
    "C216 124 224 110 236 98 C242 92 248 88 254 84 C252 94 246 102 240 108 C230 120 224 138 224 154 C238 146 256 138 278 134 " +
    "C290 132 300 134 306 138 C296 142 286 146 276 148 C254 154 238 166 232 186 C229 204 229 222 234 238 C242 252 260 262 284 266Z";
  var CANOPY = [
    [80,138,17],[96,124,23],[118,116,22],[122,136,17],[100,144,15],
    [126,90,19],[142,72,25],[166,62,24],[150,96,19],[170,84,17],

      html += '<button class="option" role="radio" aria-checked="false" data-k="' + r.key + '"><span class="gemradio"></span><span><b>' + esc(r.label) + '</b><span class="s">' + esc(r.sub) + "</span></span></button>";

    var next = THEMES[STAGE + 1];
    var base = location.origin + location.pathname;

    var realms = THEMES.map(function (t, i) {
      var locked = days < t.day;
      return '<div class="theme' + (locked ? " locked" : "") + (i === STAGE ? " current" : "") + '"><div class="thumb">' +
        sceneSVG(t, { full: true, stage: i, mood: "calm" }) +
        (locked ? '<span class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="#e8c372" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>' : "") +
        "</div><small>Day " + t.day + "<i>" + esc(t.name) + "</i></small></div>";
    }).join("");

    var links = Object.keys(APPS).map(function (k) {
      var u = base + "?app=" + k;
      return '<div class="link-row"><strong>' + esc(APPS[k].name) + '</strong><code>' + esc(u) + '</code><button class="copy" data-copy="' + esc(u) + '">Copy</button></div>';
    }).join("");

    $("ground").innerHTML =
      '<div class="stats">' +
        '<div class="stat"><b>' + dl.pass + '</b><span>Resisted today</span></div>' +
        '<div class="stat"><b>' + dl.slip + '</b><span>Yielded today</span></div>' +
        '<div class="stat"><b>' + (state.best || 0) + '</b><span>Longest streak</span></div>' +
      "</div>" +

      '<div class="card"><div class="streak-card"><div class="streak-num">' + days + '</div><div><h2>' + (days === 1 ? "Day" : "Days") + ' unbroken</h2><p>' +
        "Every day you don't give in to boredom or habit, the land around the old tree heals." +
        (next ? " " + plural(next.day - days, "more day") + " until <b>" + esc(next.name) + "</b>." : " Every realm is restored.") +
      "</p></div></div>" +
      '<div class="themes">' + realms + "</div></div>" +

      '<div class="card" id="setup"><h2>Set it up on your iPhone</h2><p>A website can\'t block apps on its own. Your iPhone\'s free <b>Shortcuts</b> app opens this page whenever you open an app you want to cut back on.</p>' +

      '<details class="step" open><summary><span class="num">1</span>Hard block at night (Screen Time)<span class="chev">›</span></summary><div class="step-body">' +
        '<span class="tag">Real blocking · 2 min</span>' +
        "<ol><li>Open <em>Settings</em> → <em>Screen Time</em>.</li>" +
        "<li>Tap <em>Downtime</em>, turn it on and pick your hours (e.g. 10:30 pm – 7:00 am).</li>" +
        "<li>Back in Screen Time, tap <em>App Limits</em> → <em>Add Limit</em>, pick Social, set a daily time.</li>" +
        "<li>Tap <em>Lock Screen Time Settings</em> and set a passcode. Without it you can just tap “Ignore Limit”. Have someone else type it, or type a random one you won't remember.</li></ol>" +
      "</div></details>" +

      '<details class="step"><summary><span class="num">2</span>Pause screen before each app<span class="chev">›</span></summary><div class="step-body">' +
        '<span class="tag">Do this once per app</span>' +
        "<ol><li>Copy that app's link below.</li>" +
        "<li>Open <em>Shortcuts</em> → <em>Automation</em> tab → <em>+</em>.</li>" +
        "<li>Choose <em>App</em>, pick the app (e.g. TikTok), keep <em>Is Opened</em> ticked, and pick <em>Run Immediately</em>. Tap <em>Next</em>.</li>" +
        "<li>Tap <em>New Blank Automation</em> → <em>Add Action</em>, search <em>Open URLs</em> and add it.</li>" +
        "<li>Tap the blue URL field, paste the link and tap <em>Done</em>.</li></ol>" +
        '<div class="links">' + links + "</div>" +
        '<div class="note">Once this is set up, “Enter anyway” won\'t work and the app will keep sending you back here. Step 3 fixes that.</div>' +
      "</div></details>" +

      '<details class="step"><summary><span class="num">3</span>Make “Enter anyway” work<span class="chev">›</span></summary><div class="step-body">' +
        '<span class="tag">A · New shortcut</span>' +
        "<ol><li>In <em>Shortcuts</em> → <em>Shortcuts</em> tab → <em>+</em>. Name it exactly <em>" + LET_ME_IN + "</em>.</li>" +
        "<li>Add <em>Adjust Date</em>: set it to <em>Add 10 minutes</em> to <em>Current Date</em>.</li>" +
        "<li>Add <em>Save File</em>: save the <em>Adjusted Date</em>, turn <em>Ask Where to Save</em> off, set the path to <em>sprout-until.txt</em> and turn <em>Overwrite If File Exists</em> on.</li>" +
        "<li>Add <em>Open URLs</em> and set the URL to <em>Shortcut Input</em>.</li></ol>" +
        '<span class="tag" style="margin-top:12px">B · Edit each app automation from step 2</span>' +
        "<ol><li>Above <em>Open URLs</em>, add <em>Get File</em>: path <em>sprout-until.txt</em>, turn <em>Error If Not Found</em> off.</li>" +
        "<li>Add <em>Get Dates from Input</em> (it uses the file).</li>" +
        "<li>Add <em>If</em>: <em>Dates</em> · <em>is after</em> · <em>Current Date</em>. Inside it, add <em>Stop This Shortcut</em>.</li>" +
        "<li>Make sure <em>Open URLs</em> sits below <em>End If</em>.</li></ol>" +
        '<div class="note">Now “Enter anyway” gives you 10 minutes in that app before the pause screen comes back.</div>' +
      "</div></details>" +

      '<details class="step"><summary><span class="num">4</span>Try it<span class="chev">›</span></summary><div class="step-body">' +
        "Do a practice run. Nothing gets counted.<div style=\"margin-top:12px\"><a class=\"btn\" style=\"font-size:15px;padding:13px\" href=\"?app=tiktok&amp;demo\">Practice pause screen</a></div>" +
      "</div></details>" +
      "</div>" +

      '<div class="footer-links"><button class="textlink" id="reset">Reset all data</button></div>';

    Array.prototype.forEach.call(document.querySelectorAll(".copy"), function (b) {
      b.addEventListener("click", function () {
        var text = b.dataset.copy;
        var ok = function () { b.textContent = "Copied"; b.classList.add("done"); setTimeout(function () { b.textContent = "Copy"; b.classList.remove("done"); }, 1600); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, function () { fallbackCopy(text); ok(); });
        else { fallbackCopy(text); ok(); }
      });
    });
    $("reset").addEventListener("click", function () {
      if (!confirm("Reset your streak and all stats?")) return;
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      location.reload();
    });
    if (location.hash === "#setup") {
      var st = document.querySelectorAll("details.step");
      if (st[2]) st[2].open = true;
      $("setup").scrollIntoView();
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    ta.remove();
  }
})();
</script>
</body>
</html>
